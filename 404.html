<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable — DWAYA</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="https://bepbep11.github.io/dwaya-site/assets/img/favicon.ico" sizes="any">
<style>
  :root { color-scheme: light dark; --bg: #F5F7F3; --fg: #1C2826; --muted: #475653; --accent: #00767C; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101B17; --fg: #ECF7F5; --muted: #B4C9C4; --accent: #7BE9DD; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif; }
  main { max-width: 34rem; padding: 32px 20px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .ar { border-block-start: 1px solid currentColor; padding-block-start: 16px; margin-block-start: 24px; }
</style>
</head>
<body>
<main>
  <h1>Page introuvable</h1>

  <p><a href="https://bepbep11.github.io/dwaya-site/">Retour à l'accueil de DWAYA</a></p>
  <div class="ar" lang="ar" dir="rtl">
    <h1>الصفحة غير موجودة</h1>
    <p>هذا العنوان غير موجود أو تغيّر.</p>
    <p><a href="https://bepbep11.github.io/dwaya-site/ar/">العودة إلى الصفحة الرئيسية لدوايا</a></p>
  </div>
</main>
</body>
</html>
